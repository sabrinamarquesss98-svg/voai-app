<!doctype html>
<html lang="pt-BR">
<head>
<!-- Travelpayouts Drive -->
<script nowprocket data-noptimize="1" data-c-fasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">
(function () {
  var script = document.createElement("script");
  script.async = 1;
  script.setAttribute("data-cmp-ab", "2");
  script.src = "https://emrldco.com/NTcyMjky.js?t=572292";
  document.head.appendChild(script);
})();

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOAÍ — Sua viagem</title>
<style>
:root{--navy:#10233f;--blue:#2563eb;--gold:#d7a84b;--ink:#172033;--muted:#667085;--white:#fff;--line:#e7eaf0;--soft:#f7f9fc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbfaf7 0%,#f5f7fb 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:20px 16px 55px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 25px}.logo{font-weight:900;font-size:30px;letter-spacing:-1.5px;color:var(--navy)}.logo span{color:var(--gold)}.back{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:9px 13px;font-weight:800}
.hero{background:var(--navy);color:#fff;border-radius:28px;padding:30px 22px;box-shadow:0 18px 45px #10233f20}.tag{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;background:#eef4ff;color:#2457bb;border-radius:999px;padding:6px 8px;margin-bottom:12px}.hero .tag{background:#ffffff18;color:#dbe8ff}.hero h1{font-size:clamp(34px,8vw,56px);line-height:1;margin:0 0 10px;letter-spacing:-2px}.hero p{margin:0;color:#dbe5f5;line-height:1.5}.total{font-size:35px;font-weight:900;margin-top:20px}.total small{display:block;font-size:12px;font-weight:500;color:#bfcce1;margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 8px 25px #182b4b0c}.card h2{margin:0 0 7px;font-size:21px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row b{color:var(--navy)}.hotelname{font-size:18px;font-weight:900;color:var(--navy);margin:4px 0}.rating{font-size:13px;color:var(--muted)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.button{display:block;text-align:center;text-decoration:none;border:0;border-radius:13px;padding:14px 10px;font-weight:900;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#eef4ff;color:#2457bb}.notice{font-size:12px;color:var(--muted);text-align:center;margin:18px 8px 0;line-height:1.5}.omio-box{margin-top:14px;background:#f7f9fc;border:1px solid var(--line);border-radius:16px;padding:12px}.omio-title{font-weight:900;color:var(--navy);margin-bottom:8px}.section-title{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:25px 2px 8px}
@media(max-width:560px){.buttons{grid-template-columns:1fr}.wrap{padding-left:14px;padding-right:14px}}
</style>

</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">VOA<span>Í</span></div><button class="back" onclick="history.back()">← Voltar</button></div>
  <div id="content"></div>
</div>
<script>
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}
function fmt(s){if(!s)return '';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
const x=JSON.parse(sessionStorage.getItem('voai_trip')||'null');
if(!x){document.getElementById('content').innerHTML='<div class="card"><h2>Não encontrei essa viagem.</h2><p class="muted">Volte para a busca e escolha uma opção novamente.</p><button class="button primary" onclick="location.href='/'">Nova busca</button></div>'}
else{
 const nights=x.checkin&&x.checkout?Math.max(1,Math.round((new Date(x.checkout)-new Date(x.checkin))/86400000)):'';
 document.getElementById('content').innerHTML=`
 <section class="hero"><span class="tag">⭐ Recomendação VOAÍ</span><h1>${esc(x.destination)} 🌎</h1><p>${esc(fmt(x.checkin))} a ${esc(fmt(x.checkout))}${nights?' • '+nights+' noites':''} • para 2 pessoas</p><div class="total">${money(x.total)}<small>${x.multiCity?'passagens + hospedagens + roteiro terrestre':'passagem + hospedagem'}</small></div></section>
 <div class="section-title">Sua viagem em um só lugar</div>
 <section class="card"><h2>✈️ Passagem aérea</h2><div class="row"><span>Companhia</span><b>${esc(x.carrier||'Companhia aérea')}</b></div><div class="row"><span>Valor encontrado</span><b>${money(x.flight)}</b></div>${x.flightLink?`<div class="buttons"><a class="button secondary" target="_blank" rel="noopener" href="${esc(x.flightLink)}">Ver ida</a>${x.returnFlightLink?`<a class="button secondary" target="_blank" rel="noopener" href="${esc(x.returnFlightLink)}">Ver volta</a>`:''}</div>`:''}</section>
 ${x.multiCity&&x.stops?`<section class="card"><h2>🚄 Deslocamentos entre cidades</h2><p class="muted">O VOAÍ identificou um roteiro com várias cidades. Abaixo você pode pesquisar os trens reais, horários e preços pela Omio.</p>${x.trainSegments.map((t,i)=>`<div class="row"><span><b>${esc(t.from)} → ${esc(t.to)}</b><small class="muted" style="display:block">Trecho ${i+1} do roteiro</small></span><a class="button secondary" style="padding:8px 10px;min-width:132px" target="_blank" rel="noopener" href="${esc(t.link)}">Ver trens e preços</a></div>`).join('')}<div class="omio-box"><div class="omio-title">🔎 Pesquise o trecho diretamente aqui</div><div id="omio-widget" data-omio-widget="true" data-partner-id="omiolps"></div></div></section>`:''}
 <section class="card"><h2>🏨 Hospedagem</h2>${x.multiCity&&x.stops?x.stops.map((s,i)=>`<div style="padding:${i?'14px 0 0':'0'};border-top:${i?'1px solid var(--line)':'0'}"><div class="muted">${esc(s.city?.name||s.city||'Cidade')}</div><div class="hotelname">${esc(s.hotel?.name||'Hospedagem disponível')}</div>${s.hotel?.rating?`<div class="rating">⭐ ${esc(s.hotel.rating)} avaliação</div>`:''}<div class="row"><span>Valor encontrado</span><b>${money(s.hotel?.amount||0)}</b></div>${s.hotel?.link?`<div class="buttons"><a class="button secondary" target="_blank" rel="noopener" href="${esc(s.hotel.link)}">Ver hospedagem</a></div>`:''}</div>`).join(''): `<div class="hotelname">${esc(x.hotelName||'Hospedagem disponível')}</div>${x.rating?`<div class="rating">⭐ ${esc(x.rating)} avaliação</div>`:''}<div class="row" style="margin-top:8px"><span>Valor encontrado</span><b>${money(x.hotel)}</b></div>${x.hotelLink?`<div class="buttons"><a class="button secondary" target="_blank" rel="noopener" href="${esc(x.hotelLink)}">Ver hospedagem</a></div>`:''}`}</section>
 <section class="card"><h2>💰 Resumo</h2><div class="row"><span>Passagem</span><b>${money(x.flight)}</b></div><div class="row"><span>Hospedagem</span><b>${money(x.hotel)}</b></div><div class="row"><span>Total</span><b>${money(x.total)}</b></div><div class="buttons"><button type="button" class="button primary" onclick="escolher()">Quero essa viagem</button></div><div id="nextStep" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)"><div class="hotelname" style="font-size:16px">Sua escolha está pronta para continuar</div><p class="muted">O VOAÍ não faz a reserva diretamente. Use os parceiros abaixo para consultar disponibilidade e concluir a compra.</p><div class="buttons">${x.flightLink?`<a class="button primary" target="_blank" rel="noopener" href="${esc(x.flightLink)}">Continuar para passagem</a>`:''}${x.hotelLink?`<a class="button secondary" target="_blank" rel="noopener" href="${esc(x.hotelLink)}">Continuar para hotel</a>`:''}${x.multiCity&&x.trainSegments?x.trainSegments.map(t=>`<a class="button secondary" target="_blank" rel="noopener" href="${esc(t.link)}">Ver trem ${esc(t.from)} → ${esc(t.to)}</a>`).join(''):''}</div></div></section>
 <p class="notice">O VOAÍ encontrou esta combinação agora. Preços e disponibilidade podem mudar até a reserva. O botão acima reúne sua escolha; para reservar, use os links de passagem e hospedagem.</p>`;
}
function escolher(){
 const box=document.getElementById('nextStep');
 if(!box)return;
 box.style.display='block';
 const notice=document.querySelector('.notice');
 if(notice)notice.textContent='Perfeito. Escolha abaixo onde você quer continuar. O VOAÍ encaminha você ao parceiro para consultar disponibilidade e concluir a reserva.';
 box.scrollIntoView({behavior:'smooth',block:'center'});
}
</script>

<script>
(function addOmioWidget(d){
  var css=d.createElement('link');
  css.rel='stylesheet';
  css.href='https://www.omio.com/gcs-proxy/b2b-nemo-prod/bundle/en/bundle.css?v='+Date.now();
  d.head.appendChild(css);
  var js=d.createElement('script');
  js.src='https://www.omio.com/gcs-proxy/b2b-nemo-prod/bundle/en/bundle.js?v='+Date.now();
  js.async=true;
  d.body.appendChild(js);
})(document);
</script>
</body>
</html>
